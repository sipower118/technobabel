name: Generate

# Turn collected items into carousel drafts and render their slides locally.
# Leaves the drafts in the `drafted` state for review; nothing is approved and
# nothing is posted. Touches state, so it round-trips the database.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: How many drafts to write this run.
        required: false
        default: "2"
        type: string
  # schedule:
  #   # 06:00 UTC daily, ahead of the render job. Edit or delete this to control
  #   # the cadence; drafts are only ever created, never approved or posted.
  #   - cron: "7 6 * * *"

permissions:
  contents: write

concurrency:
  # Shared across every stage: they all read-modify-write the one database on
  # gh-pages, so two at once means the second commit drops the first's work.
  group: pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
          ig-user-id: ${{ secrets.IG_USER_ID }}
          ig-access-token: ${{ secrets.IG_ACCESS_TOKEN }}
          reddit-client-id: ${{ secrets.REDDIT_CLIENT_ID }}
          reddit-client-secret: ${{ secrets.REDDIT_CLIENT_SECRET }}
          asset-storage: ${{ vars.ASSET_STORAGE || 'pages' }}
          asset-local-dir: ${{ vars.ASSET_LOCAL_DIR || 'site' }}
          public-asset-base-url: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          github-pages-branch: ${{ vars.GITHUB_PAGES_BRANCH || 'gh-pages' }}
          pages-settle-seconds: ${{ vars.PAGES_SETTLE_SECONDS || '90' }}

      - name: Restore state
        uses: ./.github/actions/state_restore

      - name: Generate
        run: uv run accelerated-devops generate --posts "${{ inputs.posts || 2 }}"

      - name: Show what is waiting for review
        run: uv run accelerated-devops list

      - name: Commit state
        if: always()
        uses: ./.github/actions/state_commit
        with:
          message: "generate: write new carousel drafts"
