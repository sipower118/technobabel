name: Setup pipeline
description: >-
  Install the CLI with uv and expose the pipeline's configuration to later
  steps. Every workflow starts here so there is one place that knows how the
  project is built and which secrets it needs.

on:
  workflow_call:

inputs:
  python-version:
    description: Python version for the venv.
    required: false
    default: "3.12"
  env-file:
    description: >-
      Optional path to a committed .env with the non-secret settings (asset
      storage mode, public base URL, brand). Secrets still come from the
      repository secret list below and always win, because load_settings()
      reads the environment first.
    required: false
    default: ""

jobs:
  setup:
    runs-on: ubuntu-latest  
    steps:  

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen || uv sync
        shell: bash

      - name: Load non-secret settings
        if: ${{ inputs.env-file != '' }}
        run: |
          set -a
          # shellcheck disable=SC1090
          source "${{ inputs.env-file }}"
          set +a
        shell: bash

      - name: Export the pipeline configuration
        shell: bash
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # The asset backend, so a runner needs no local server or tunnel.
          ASSET_STORAGE: ${{ vars.ASSET_STORAGE || 'pages' }}
          ASSET_LOCAL_DIR: ${{ vars.ASSET_LOCAL_DIR || 'site' }}
          PUBLIC_ASSET_BASE_URL: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          GITHUB_PAGES_BRANCH: ${{ vars.GITHUB_PAGES_BRANCH || 'gh-pages' }}
          PAGES_SETTLE_SECONDS: ${{ vars.PAGES_SETTLE_SECONDS || '90' }}
          DATA_DIR: ${{ github.workspace }}/data
        run: |
          # Repository variables cannot be referenced from `env:` defaults, so the
          # pieces that GitHub already provides for free are filled in here.
          # No write credential is exported, because the pipeline code has none and
          # needs none: committing to the artefact branch is the state action's
          # job, using the credentials actions/checkout already left in its
          # .pages checkout.
          echo "ASSET_STORAGE=${ASSET_STORAGE}"        >> "$GITHUB_ENV"
          echo "ASSET_LOCAL_DIR=${ASSET_LOCAL_DIR}"    >> "$GITHUB_ENV"
          echo "PUBLIC_ASSET_BASE_URL=${PUBLIC_ASSET_BASE_URL}" >> "$GITHUB_ENV"
          echo "GITHUB_PAGES_BRANCH=${GITHUB_PAGES_BRANCH}"     >> "$GITHUB_ENV"
          echo "PAGES_SETTLE_SECONDS=${PAGES_SETTLE_SECONDS}"  >> "$GITHUB_ENV"
          echo "DATA_DIR=${DATA_DIR}"                  >> "$GITHUB_ENV"
          echo "GEMINI_API_KEYS=${GEMINI_API_KEYS}"    >> "$GITHUB_ENV"
          echo "IG_USER_ID=${IG_USER_ID}"              >> "$GITHUB_ENV"
          echo "IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}"    >> "$GITHUB_ENV"
          echo "REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}"      >> "$GITHUB_ENV"
          echo "REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}" >> "$GITHUB_ENV"
