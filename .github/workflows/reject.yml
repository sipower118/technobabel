name: Reject

# Drop drafts out of the queue. Takes either explicit fingerprints or the
# oldest N, mirroring the approve workflow. Touches state.
on:
  workflow_dispatch:
    inputs:
      fingerprints:
        description: Space-separated fingerprints. Leave empty to reject the oldest drafts.
        required: false
        default: ""
        type: string
      count:
        description: How many of the oldest drafts to reject when no fingerprints are given.
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  # Shared across every stage: they all read-modify-write the one database on
  # gh-pages, so two at once means the second commit drops the first's work.
  group: pipeline
  cancel-in-progress: false

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Restore state
        uses: ./.github/actions/state
        with:
          operation: restore

      - name: Reject
        run: |
          if [ -n "${{ inputs.fingerprints }}" ]; then
            # shellcheck disable=SC2086
            uv run accelerated-devops reject ${{ inputs.fingerprints }}
          else
            mapfile -t queue < <(uv run accelerated-devops list --status draft \
              --ids --limit "${{ inputs.count || 1 }}")
            if [ ${#queue[@]} -eq 0 ]; then
              echo "nothing left to reject"
              exit 0
            fi
            uv run accelerated-devops reject "${queue[@]}"
          fi

      - name: Commit state
        if: always()
        uses: ./.github/actions/state
        with:
          operation: commit
          message: "reject: drop drafts from the queue"
