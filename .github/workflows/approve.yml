name: Approve

# Move drafts from `drafted` to `approved`, which is what puts them in the
# publish queue. Takes either explicit fingerprints or the oldest N drafts, so
# a review can be as coarse or as fine as you like. Touches state.
on:
  workflow_dispatch:
    inputs:
      fingerprints:
        description: Space-separated fingerprints. Leave empty to auto-approve the oldest drafts.
        required: false
        default: ""
        type: string
      count:
        description: How many of the oldest drafts to approve when no fingerprints are given.
        required: false
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  # Shared across every stage: they all read-modify-write the one database on
  # gh-pages, so two at once means the second commit drops the first's work.
  group: pipeline
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
          ig-user-id: ${{ secrets.IG_USER_ID }}
          ig-access-token: ${{ secrets.IG_ACCESS_TOKEN }}
          reddit-client-id: ${{ secrets.REDDIT_CLIENT_ID }}
          reddit-client-secret: ${{ secrets.REDDIT_CLIENT_SECRET }}
          asset-storage: ${{ vars.ASSET_STORAGE || 'pages' }}
          asset-local-dir: ${{ vars.ASSET_LOCAL_DIR || 'site' }}
          public-asset-base-url: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          github-pages-branch: ${{ vars.GITHUB_PAGES_BRANCH || 'gh-pages' }}
          pages-settle-seconds: ${{ vars.PAGES_SETTLE_SECONDS || '90' }}

      - name: Restore state
        uses: ./.github/actions/state_restore

      - name: Show what is waiting
        run: uv run accelerated-devops list --status draft

      - name: Approve
        run: |
          if [ -n "${{ inputs.fingerprints }}" ]; then
            # shellcheck disable=SC2086
            uv run accelerated-devops approve ${{ inputs.fingerprints }}
          else
            # Oldest first, so the publish queue drains in review order.
            mapfile -t queue < <(uv run accelerated-devops list --status draft \
              --ids --limit "${{ inputs.count || 2 }}")
            if [ ${#queue[@]} -eq 0 ]; then
              echo "nothing left to approve"
              exit 0
            fi
            uv run accelerated-devops approve "${queue[@]}"
          fi

      - name: Commit state
        if: always()
        uses: ./.github/actions/state_commit
        with:
          message: "approve: queue drafts for publishing"
