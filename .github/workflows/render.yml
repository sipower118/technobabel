name: Render

# Re-render the slides for drafts that are waiting. The rendered PNGs stay in
# the workspace and this workflow only commits the database back to gh-pages.
# Getting the slides onto the Pages site is a deployment step of its own: put
# them at <fingerprint>/<fingerprint>_NN.jpg under the site root, which is the
# one layout `publish` builds every image URL from.
on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: Re-render and publish one draft. Omit for all pending ones.
        required: false
        default: ""
        type: string
      status:
        description: Which drafts to re-render when no fingerprint is given.
        required: false
        default: draft
        type: choice
        options: [draft, approved, scheduled]
  # schedule:
  #   # 06:30 UTC daily, after generate. This is the step that makes a render
  #   # reviewable in a browser and available to the publish job.
  #   - cron: "41 6 * * *"

permissions:
  contents: write

concurrency:
  # Shared across every stage: they all read-modify-write the one database on
  # gh-pages, so two at once means the second commit drops the first's work.
  group: pipeline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
          ig-user-id: ${{ secrets.IG_USER_ID }}
          ig-access-token: ${{ secrets.IG_ACCESS_TOKEN }}
          reddit-client-id: ${{ secrets.REDDIT_CLIENT_ID }}
          reddit-client-secret: ${{ secrets.REDDIT_CLIENT_SECRET }}
          public-asset-base-url: ${{ vars.PUBLIC_ASSET_BASE_URL }}

      - name: Restore state
        uses: ./.github/actions/state_restore

      - name: Render slides
        run: |
          if [ -n "${{ inputs.fingerprint }}" ]; then
            uv run accelerated-devops render "${{ inputs.fingerprint }}"
          else
            uv run accelerated-devops render --status "${{ inputs.status || 'draft' }}" --limit 10
          fi

      - name: Commit state
        if: always()
        uses: ./.github/actions/state_commit
        with:
          message: "render: refresh the rendered slides"

      - name: Say where the slides belong
        run: |
          echo "Publish <fingerprint> from ${PUBLIC_ASSET_BASE_URL}/<fingerprint>/"
          echo "Slides must be served as <fingerprint>/<fingerprint>_NN.jpg under that root."
