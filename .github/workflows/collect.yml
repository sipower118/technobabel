name: Collect

# Fetch every source into the item pool. Touches state, so it restores the
# database from gh-pages first and commits it back afterwards.
on:
  workflow_dispatch:
  # schedule:
  #   # Every 3 hours, off the hour. GitHub cron is UTC and the schedule can be
  #   # delayed by minutes when the platform is busy, which is fine for a
  #   # source scrape.
  #   - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  # One stage at a time, across ALL workflows. They share the single SQLite
  # file on gh-pages, so two of them running together would both restore the
  # same starting state and the second commit would silently drop the first's
  # work. GitHub queues the rest rather than cancelling: cancelling a publish
  # mid-flight is the one outcome Instagram cannot undo.
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          gemini-api-keys: ${{ secrets.GEMINI_API_KEYS }}
          ig-user-id: ${{ secrets.IG_USER_ID }}
          ig-access-token: ${{ secrets.IG_ACCESS_TOKEN }}
          reddit-client-id: ${{ secrets.REDDIT_CLIENT_ID }}
          reddit-client-secret: ${{ secrets.REDDIT_CLIENT_SECRET }}
          asset-storage: ${{ vars.ASSET_STORAGE || 'pages' }}
          asset-local-dir: ${{ vars.ASSET_LOCAL_DIR || 'site' }}
          public-asset-base-url: ${{ vars.PUBLIC_ASSET_BASE_URL }}
          github-pages-branch: ${{ vars.GITHUB_PAGES_BRANCH || 'gh-pages' }}
          pages-settle-seconds: ${{ vars.PAGES_SETTLE_SECONDS || '90' }}

      - name: Restore state
        uses: ./.github/actions/state_restore

      - name: Collect
        run: uv run accelerated-devops collect

      - name: Commit state
        if: always()
        uses: ./.github/actions/state_commit
        with:
          message: "collect: refresh the item pool"
